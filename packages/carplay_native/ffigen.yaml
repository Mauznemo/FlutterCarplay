# Generates the Dart bindings for the C ABI in src/cp_core.h.
#
#   dart run ffigen --config ffigen.yaml
#
# Re-run this whenever cp_core.h changes. The generated file is committed so that
# building the package does not require libclang.

name: CpCoreBindings
description: |
  Bindings to the native CarPlay head unit core.

  Generated from src/cp_core.h by package:ffigen. Do not edit by hand.
output: 'lib/src/bindings/cp_core_bindings.dart'
headers:
  entry-points:
    - 'src/cp_core.h'
  include-directives:
    - '**cp_core.h'
functions:
  include:
    - 'cp_.*'
# Every type the header declares, listed in full rather than left to be pulled in
# through the functions that use them, so a type nothing references yet still
# generates.
structs:
  include:
    - 'CpSession'
    - 'CpConfig'
    - 'CpTouchPoint'
enums:
  include:
    - 'CpState'
    - 'CpTouchAction'
    - 'CpAudioStream'
    - 'CpMicrophone'
    - 'CpMetadata'
typedefs:
  include:
    - 'CpEventCallback'
    - 'CpAudioCallback'
    - 'CpMetadataCallback'
comments:
  style: any
  length: full
preamble: |
  // SPDX-License-Identifier: GPL-3.0-or-later
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: unused_element, unused_field, public_member_api_docs
  // coverage:ignore-file
