name: carplay
description: "Run Apple CarPlay inside a Flutter app through a Carlinkit adapter. Renders the iPhone's screen into a Flutter Texture so the app can draw its own UI on top."
version: 0.0.1
repository: https://github.com/Mauznemo/FlutterCarplay
license: GPL-3.0-or-later
# Not published until something has projected through it. See PLAN.md.
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.3
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  carplay_platform_interface: ^0.0.1
  carplay_native: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        default_package: carplay_native
      android:
        default_package: carplay_native
      # The real head unit runs on Linux. These two get a pure Dart simulator, so a host
      # app can be developed on the machines most people write Flutter on.
      macos:
        dartPluginClass: CarPlaySimulator
      windows:
        dartPluginClass: CarPlaySimulator
